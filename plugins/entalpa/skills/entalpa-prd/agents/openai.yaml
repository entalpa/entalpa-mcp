interface:
  display_name: "Entalpa PRD"
  short_description: "Generate grounded PRD and BRD documents"
  default_prompt: "Use $entalpa-prd to generate a grounded PRD or BRD from my Entalpa project without modifying project data."
dependencies:
  tools:
